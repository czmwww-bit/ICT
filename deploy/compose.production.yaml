name: silver-service-production
# 此文件没有 MySQL 服务，云端只连接 RDS。
services:
  backend:
    image: ${APP_IMAGE:-silver-evidence:local}
    build:
      context: ../backend
      target: production
    init: true
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:?set absolute path to production env}
    expose:
      - "3000"
    volumes:
      - ${RDS_CA_FILE:?set absolute path to RDS CA}:/run/certs/rds-ca.pem:ro
    security_opt:
      - no-new-privileges:true
  nginx:
    image: nginx:stable-alpine
    profiles: [web]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${FRONTEND_DIST:-../frontend/dist}:/usr/share/nginx/html:ro
      - ${HTTPS_CERT_DIR:-./certs}:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
